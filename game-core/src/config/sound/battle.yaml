  muffleStart: 0.3
  muffleSpan: 1.2
  lowpassNearHz: 18000
  lowpassFarHz: 900
  lowpassQ: 0.7
synth:
  envelopeFloor: 0.0001
  samplePlayback: { minRate: 0.5, maxRate: 2, jitterBase: 0.96, jitterRange: 0.08 }
  noiseBuffer: { durationSeconds: 0.45, priorMix: 0.72, whiteMix: 0.28 }
  fire:
    partMaxVolume: 2
    strengthDamageScale: 80
    sampleBaseVolume: 0.13
    sampleStrengthVolume: 0.1
    fallbackBaseVolume: 0.035
    fallbackStrengthVolume: 0.085
    projectileFrequencyMax: 280
    projectileFrequencyScale: 0.12
    endingFrequencyMin: 45
    endingFrequencyRatio: 0.38
    envelopeStart: 0.8
    rapidNoiseFilterHz: 1500
    otherNoiseFilterHz: 520
    profiles:
      rapid-fire: { frequency: 520, duration: 0.045, wave: square, noise: 0.24 }
      heavy-shot: { frequency: 145, duration: 0.16, wave: sawtooth, noise: 0.5 }
      explosive: { frequency: 105, duration: 0.2, wave: sawtooth, noise: 0.65 }
      tracking: { frequency: 260, duration: 0.13, wave: triangle, noise: 0.36 }
      beam-precision: { frequency: 980, duration: 0.12, wave: sine, noise: 0.08 }
  cannonTail:
    baseDuration: 0.34
    strengthDuration: 0.12
    baseVolume: 0.045
    strengthVolume: 0.055
    startFrequency: 82
    endFrequency: 31
    envelopeStart: 0.85
  impact:
    severityDamageScale: 140
    heavySamples: [impact-heavy-1, impact-heavy-2]
    lightSamples: [impact-light-1, impact-light-2, impact-light-3, impact-light-4]
    heavyBaseVolume: 0.12
    heavySeverityVolume: 0.16
    lightBaseVolume: 0.075
    lightSeverityVolume: 0.1
    baseDuration: 0.055
    severityDuration: 0.2
    baseVolume: 0.018
    severityVolume: 0.085
    armorFrequencyScale: 2.5
    endingFrequencyMin: 45
    endingFrequencyRatio: 0.22
    envelopeStart: 0.8
    profiles:
      rapid-fire: { frequency: 920, wave: square, noise: 0.45 }
      heavy-shot: { frequency: 230, wave: sawtooth, noise: 0.72 }
      explosive: { frequency: 120, wave: sawtooth, noise: 1 }
      tracking: { frequency: 330, wave: triangle, noise: 0.65 }
      beam-precision: { frequency: 1280, wave: sine, noise: 0.18 }
  explosion:
    minimumSeverity: 0.15
    intensityScale: 180
    baseDuration: 0.22
    severityDuration: 0.38
    baseVolume: 0.08
    severityVolume: 0.16
    lowpassBaseFrequency: 1600
    lowpassSeverityFrequency: 900
    lowpassEndFrequency: 90
    envelopeStart: 0.7
    boomStartFrequency: 95
    boomEndFrequency: 32
  spawn:
    volume: 0.038
    playerStartFrequency: 180
    enemyStartFrequency: 140
    airEndFrequency: 720
    groundEndFrequency: 410
    rampDuration: 0.18
    envelopeStart: 0.7
    envelopeDuration: 0.22
    stopDuration: 0.23
  engine:
    minimumMovingSpeed: 8
    maxAudibleUnits: 5
    baseVolume: 0.007
    speedVolume: 0.014
    airBaseFrequency: 72
    airSpeedFrequency: 90
    groundBaseFrequency: 38
    groundSpeedFrequency: 42
    envelopeStart: 0.55
    envelopeDuration: 0.2
    stopDuration: 0.21
    basePulseInterval: 0.16
    speedPulseInterval: 0.12
