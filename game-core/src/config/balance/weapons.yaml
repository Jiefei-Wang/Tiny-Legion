_descriptions:
  components.*.mass: Base mass contributed by this weapon component.
  components.*.hpMul: Legacy component durability multiplier retained by component stats and authoring compatibility.
  components.*.gasCost: Gas cost contributed by this weapon to its craft.
  components.*.type: Runtime component family; weapon entries must use weapon.
  components.*.directional: Whether rotating the placed part also rotates its functional firing direction; this is separate from its allowed firing arc.
  components.*.projectileClass: Projectile behavior family used by firing, AI, collision, and loaders.
  components.*.projectileShape: Asset-backed projectile shape used by rendering and fitted collision.
  components.*.projectileSizeRatio: Uniform projectile visual and collider scale multiplier.
  components.*.maxLoadedAmmo: Maximum number of ready rounds the weapon can hold.
  components.*.recoil: Impulse applied to the firing craft.
  components.*.hitImpulse: Impulse applied to a target struck by this weapon.
  components.*.damage: Direct damage delivered by one projectile or beam hit before armor.
  components.*.range: Authored targeting and firing range before global range scaling.
  components.*.cooldown: Minimum seconds between weapon firing attempts.
  components.*.hasAngleLimit: Whether the base weapon definition limits aiming around its facing.
  components.*.cwAngle: Maximum clockwise aiming angle in degrees when the base weapon angle limit is enabled.
  components.*.ccwAngle: Maximum counter-clockwise aiming angle in degrees when the base weapon angle limit is enabled.
  components.*.projectileSpeed: Initial speed of projectiles fired by this weapon.
  components.*.projectileGravity: Downward acceleration applied to this weapon's projectile.
  components.*.penetration: Initial penetration budget available to pass through hit parts.
  components.*.spreadDeg: Maximum random angular spread applied to a shot.
  components.*.explosive.blastRadius: World-space radius affected when this projectile explodes.
  components.*.explosive.blastDamage: Maximum splash damage at the center of the explosion.
  components.*.explosive.falloffPower: Curve exponent controlling how splash damage decreases with distance.
  components.*.tracking.turnRateDegPerSec: Maximum homing rotation rate of the tracking projectile.
